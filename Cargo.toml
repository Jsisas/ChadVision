[package]
name = "chadvision"
version = "0.1.0"
edition = "2021"

[dependencies]
ab_glyph = "0.2.32"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
fast_image_resize = { version = "5", features = ["image"] }
image = { version = "0.25", default-features = false, features = ["png", "webp", "jpeg"] }
imageproc = "0.27.0"
ndarray = "0.16"
num_cpus = "1"
rand = "0.9"
rand_chacha = "0.9"
rayon = "1"
reqwest = { version = "0.12", optional = true, default-features = false, features = ["blocking", "json", "rustls-tls", "gzip"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
strsim = "0.11"

[profile.release]
debug = 1

[target.'cfg(not(windows))'.dependencies]
ort = { version = "=2.0.0-rc.10", features = ["download-binaries", "ndarray"] }

# Windows: the prebuilt static ONNX Runtime needs DirectML.lib, which cross-compiling from Linux lacks.
# Load onnxruntime.dll (1.22.x, shipped next to the exe) at runtime instead.
[target.'cfg(windows)'.dependencies]
ort = { version = "=2.0.0-rc.10", default-features = false, features = ["std", "ndarray", "load-dynamic"] }

[features]
# HTTP downloads (refs, models) for the CLI; library users that only identify can drop it.
default = ["fetch"]
fetch = ["dep:reqwest"]

[[bin]]
name = "chadvision"
path = "src/main.rs"
required-features = ["fetch"]

[lib]
name = "chadvision"
crate-type = ["cdylib", "rlib"]
